  <style>
    :root {
      --bg-deep: #0f1117;
      --bg-card: #181b23;
      --bg-card-hover: #1e2230;
      --border-card: #252a36;
      --text-primary: #e8e9ed;
      --text-secondary: #8b8f9a;
      --text-muted: #5c6070;
      --accent: #d4804a;
      --accent-hover: #e09060;
      --font-body: 'DM Sans', sans-serif;
      --font-mono: 'Space Mono', monospace;
      --max-width: 680px;
      --radius: 12px;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-deep);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── Nav ── */
    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 16px 24px;
      background: rgba(15, 17, 23, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-card);
    }

    .nav a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.2s, background 0.2s;
    }

    .nav a:hover {
      color: var(--text-primary);
      background: var(--bg-card);
    }

    .nav a:focus-visible,
    .social-links a:focus-visible,
    .post-item:focus-visible,
    .btn:focus-visible,
    footer nav a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .nav a svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── Layout ── */
    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 20px;
    }

    section {
      margin-bottom: 24px;
    }

    /* ── Hero Card ── */
    .hero-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius);
      padding: 48px 32px;
      text-align: center;
      margin-top: 32px;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 12px;
      border: 2px solid var(--border-card);
    }

    .handle {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .hero-card h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .social-links a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid var(--accent);
      color: var(--accent);
      transition: background 0.2s, color 0.2s;
    }

    .social-links a:hover {
      background: var(--accent);
      color: var(--bg-deep);
    }

    .social-links a svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .bio {
      font-size: 0.95rem;
      color: var(--text-secondary);
      max-width: 360px;
      margin: 0 auto;
      line-height: 1.7;
    }

    /* ── Posts Card ── */
    .posts-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius);
      padding: 32px;
    }

    .posts-card h2 {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 24px;
    }

    .post-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 0;
      border-top: 1px solid var(--border-card);
      text-decoration: none;
      color: inherit;
      transition: opacity 0.2s;
    }

    .post-item:hover {
      opacity: 0.85;
    }

    .post-content {
      flex: 1;
    }

    .post-content h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .post-content p {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .post-meta {
      display: flex;
      gap: 16px;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .post-arrow {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border-card);
      color: var(--accent);
      margin-top: 4px;
      transition: background 0.2s, border-color 0.2s;
    }

    .post-item:hover .post-arrow {
      background: var(--bg-card-hover);
      border-color: var(--accent);
    }

    .post-arrow svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── CTA Card ── */
    .cta-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius);
      padding: 48px 32px;
      text-align: center;
    }

    .cta-card h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 20px;
      line-height: 1.3;
    }

    .btn {
      display: inline-block;
      padding: 10px 28px;
      font-family: var(--font-body);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--bg-deep);
      background: var(--text-secondary);
      border: none;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--text-primary);
    }

    /* ── Footer ── */
    footer {
      margin-top: 24px;
      padding: 40px 20px 32px;
      text-align: center;
    }

    footer .footer-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 12px;
    }

    footer nav {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 20px;
    }

    footer nav a {
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.2s;
    }

    footer nav a:hover {
      color: var(--text-primary);
    }

    footer .credit {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* ── Blog post page (used by individual posts) ── */
    .post-page {
      margin-top: 32px;
    }

    .post-page .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      text-decoration: none;
      margin-bottom: 24px;
      transition: color 0.2s;
    }

    .post-page .back-link:hover {
      color: var(--accent);
    }

    .post-page article {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius);
      padding: 40px 32px;
    }

    .post-page article h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .post-page article .post-meta {
      margin-bottom: 28px;
    }

    .post-page article p {
      font-size: 0.95rem;
      color: var(--text-secondary);
      line-height: 1.8;
      margin-bottom: 16px;
    }

    /* ── Responsive ── */
    @media (max-width: 520px) {
      .hero-card { padding: 36px 20px; }
      .posts-card { padding: 24px 20px; }
      .cta-card { padding: 36px 20px; }
      .hero-card h1 { font-size: 1.35rem; }
    }

    /* ── Fade-in animation ── */
    .fade-up {
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.5s ease forwards;
    }

    .fade-up:nth-child(2) { animation-delay: 0.08s; }
    .fade-up:nth-child(3) { animation-delay: 0.16s; }
    .fade-up:nth-child(4) { animation-delay: 0.24s; }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
